services:
  pipeline-service:
    build: .
    image: dotnet-8-python-310
    volumes:
      - .:/app
    shm_size: '6gb'
  initialize-jupyter-lab:
    build: .
    image: dotnet-8-python-310
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    tty: true
    command: jupyter lab --ip=0.0.0.0 --no-browser --LabApp.token=''
  initialize-fastapi:
    build: .
    image: dotnet-8-python-310
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    tty: true
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
  initialize-analytics-hub:
    build: .
    image: dotnet-8-python-310
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - .:/app
    tty: true
    command: streamlit run analytics_hub.py --server.address=0.0.0.0 --server.port=8501
